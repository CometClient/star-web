name = "comet-web-cf-worker-testing"
compatibility_date = "2026-05-21"
compatibility_flags = [ "nodejs_compat" ]

# Service binding: lets this worker call comet-db directly over CF's internal
# network, bypassing the *.workers.dev → *.workers.dev HTTP loopback block.
[[services]]
binding = "DB_WORKER"
service = "comet-db"

[vars]
DB_API_URL = "https://comet-db.cold-mc.workers.dev"
PUBLIC_DB_API_URL = "https://comet-db.cold-mc.workers.dev"

[assets]
directory = "./dist/client"