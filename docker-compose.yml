version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      - VITE_API_URL=http://localhost:3000

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: comet_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_PASSWORD: password
      MYSQL_USER: user
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./comet_full_database.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./server
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=comet_db
      - PORT=3000

volumes:
  db_data:
